<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karan</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: #111827;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: 680px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 2.2rem;
    }
    p {
      line-height: 1.6;
      color: #cbd5e1;
    }
    code {
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 8px;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello Karan 👋</h1>
    <p>This page is being served from your <code>karan</code> nginx container.</p>
    <p>Your repo/workspace is connected on the host, and this custom page was added for you.</p>
  </div>
</body>
</html>
